<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>High Frontier 4 All 日本語得点表</title>
<style>
:root{font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo,system-ui,sans-serif;color:#1b2833;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}.toolbar{position:sticky;top:0;background:#142e43;color:white;padding:12px max(14px,calc((100vw - 1160px)/2));z-index:10;box-shadow:0 3px 10px #0002}.toolbar-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar h1{font-size:16px;margin:0 auto 0 0}.toolbar label{font-size:12px}button,select{border:1px solid #aac0d0;border-radius:6px;background:white;color:#16334b;padding:8px 11px;font-weight:600;cursor:pointer}button.primary{background:#0b7ca3;border-color:#0b7ca3;color:white}button:hover{filter:brightness(.95)}.wrap{max-width:1160px;margin:20px auto;padding:0 12px}.hint{font-size:13px;background:#e2f0f7;border-left:4px solid #1682af;padding:12px 15px;border-radius:4px;margin-bottom:18px}.page{background:#fff;box-shadow:0 4px 22px #192b3c1c;margin:0 auto 22px;padding:18px 20px 16px;max-width:1140px;border-radius:5px}.heading{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #163f60;margin-bottom:10px;padding-bottom:7px}.heading h2{font-size:20px;letter-spacing:.04em;margin:0}.heading p{font-size:11px;margin:0;color:#637381}.score-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}.score-table th,.score-table td{border:1px solid #b8c5d1;padding:4px 6px;vertical-align:middle}.score-table thead th{background:#183e59;color:white;text-align:center}.col-name{width:30%}.col-info{width:28%}.score-table th.player-col{width:7%}.score-table tr.section td{background:#dce9f0;font-weight:bold;color:#133c53;padding:5px 6px}.score-table tbody td.info{font-size:10.5px;color:#4c5f6a;line-height:1.3;white-space:pre-line}.score-table tbody td.name{font-weight:500}.english-name{display:block;font-size:10px;line-height:1.15;color:#667989;font-weight:400;margin-top:2px;overflow-wrap:anywhere}.factory-shared{text-align:left;vertical-align:middle!important}.score-table tbody td.score{padding:2px 3px;text-align:center}.score-table input.score-input{width:100%;min-width:0;text-align:center;padding:5px 2px;font:600 13px system-ui,sans-serif;border:1px solid #d7e2e9;border-radius:3px;background:#f9fcff;color:#1b2833}.score-table input:focus{outline:2px solid #258bb2}.score-table input:disabled{display:none}.total td{background:#d5e9dc;font-weight:700;font-size:14px}.total .number{text-align:center}.subtot td{background:#edf5f0;font-weight:600}.player-name{width:100%;min-width:0;border:1px solid #8baec2;padding:5px 1px;border-radius:4px;text-align:center;color:#163d57;font-weight:600}.hidden{display:none!important}.footer{display:flex;justify-content:space-between;color:#7e8c94;font-size:10px;margin-top:10px}.muted{color:#788b9a}.right{text-align:right}#status{font-size:11px;color:#abd7cd}@page{size:A4 portrait;margin:9mm 8mm} @media print{html,body{width:100%;background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar,.hint,.no-print{display:none!important}.wrap{padding:0;margin:0;max-width:none}.page{box-shadow:none;border-radius:0;max-width:none;width:100%;padding:0;margin:0;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}.heading{margin-bottom:5px;padding-bottom:4px}.heading h2{font-size:15px}.score-table{font-size:8px}.score-table td,.score-table th{padding:2px 3px;line-height:1.2}.score-table tbody td.info{font-size:7px;line-height:1.14}.english-name{font-size:6.8px;line-height:1.07;margin-top:0}.score-table tbody td.name{line-height:1.12}.score-table tr.section td{padding:3px}.score-table input.score-input{background:transparent;border:0;padding:1px 0;font-size:9px}.player-name{background:transparent;border:0;font-size:8px;padding:0}.total td{font-size:10px}.footer{font-size:8px;margin-top:5px}tr{break-inside:avoid} }@media(max-width:740px){.page{overflow-x:auto;padding:13px 10px}.score-table{min-width:700px}.toolbar h1{flex-basis:100%}}
</style></head><body>
<div class="toolbar"><div class="toolbar-inner"><h1>HIGH FRONTIER 4 ALL ｜ 日本語得点表</h1><label>プレイヤー人数 <select id="count"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><button class="primary" id="print">PDF保存・印刷</button><button id="reset">入力を初期化</button><span id="status">自動保存有効</span></div></div>
<main class="wrap"><div class="hint">各マスには<strong>獲得したVPを直接入力</strong>してください（数量ではありません）。合計は自動計算されます。入力はこのブラウザに自動保存されます。<strong>「PDF保存・印刷」</strong>を押し、印刷画面の送信先で「PDFに保存」を選んでください。フューチャーの達成条件・倍率等は各行の説明を参考に、該当するVPだけを入力してください。</div><div id="pages"></div></main>
<script>
const DATA=[[{"heading": "トークンVP", "items": [{"id": "p1g0r0", "name": "プラスチック／木製のコマ", "info": "各1VP（ロケット、クレイム、工場、コロニー、フレイター、バナール）"}, {"id": "p1g0r1", "name": "評議会の評議員", "info": "各1VP（M0）"}]}, {"heading": "工場資産価値", "items": [{"id": "p1g1r0", "name": "工場資産価値 C", "info": "工場1つにつき8／5／4VP（開発トラック参照）。\n宇宙エレベータ接続時×2（M2）、戦争終了時は各2VP（M3）"}, {"id": "p1g1r1", "name": "工場資産価値 S", "info": ""}, {"id": "p1g1r2", "name": "工場資産価値 M", "info": ""}, {"id": "p1g1r3", "name": "工場資産価値 V", "info": ""}, {"id": "p1g1r4", "name": "工場資産価値 D", "info": ""}, {"id": "p1g1r5", "name": "工場資産価値 H", "info": ""}]}, {"heading": "コロニーの種類", "items": [{"id": "p1g2r0", "name": "宇宙生物学コロニー", "info": "各+1VP"}, {"id": "p1g2r1", "name": "地下海洋コロニー", "info": "各+2VP"}, {"id": "p1g2r2", "name": "バナールコロニー", "info": "各+2VP（M2）"}]}, {"heading": "グローリー／ヒロイズム", "items": [{"id": "p1g3r0", "name": "水星", "info": "1VP／3VP"}, {"id": "p1g3r1", "name": "金星", "info": "1VP／2VP"}, {"id": "p1g3r2", "name": "地球", "info": "1VP／2VP"}, {"id": "p1g3r3", "name": "火星", "info": "1VP／2VP"}, {"id": "p1g3r4", "name": "ケレス", "info": "1VP／3VP"}, {"id": "p1g3r5", "name": "木星", "info": "1VP／3VP"}, {"id": "p1g3r6", "name": "土星", "info": "1VP／4VP"}, {"id": "p1g3r7", "name": "天王星", "info": "1VP／5VP"}, {"id": "p1g3r8", "name": "海王星", "info": "1VP／6VP"}, {"id": "p1g3r9", "name": "ヒロイズム", "info": "各2VP"}]}, {"heading": "バナール（M2）", "items": [{"id": "p1g4r0", "name": "ホームバナール", "info": "6VP"}, {"id": "p1g4r1", "name": "バナールのダートサイド水資源値", "info": "水資源値1につき1VP"}, {"id": "p1g4r2", "name": "プロモート状態癌病院バナール", "info": "コロニードーム1つにつき+1VP"}, {"id": "p1g4r3", "name": "プロモート状態外交バナール", "info": "評議会の自派評議員1人につき+1VP"}, {"id": "p1g4r4", "name": "プロモート状態気候制御バナール", "info": "当該バナールのダートサイド1つにつき+2VP"}, {"id": "p1g4r5", "name": "観光サイクラー", "info": "当該バナールのダートサイド1つにつき+2VP"}, {"id": "p1g4r6", "name": "SSO外交バナール", "info": "自派閥色のイデオロギーにいる自派評議員1人につき+1VP"}]}, {"heading": "政治：ゲーム終了時の有効理念（M0）", "items": [{"id": "p1g5r0", "name": "自由", "info": "工場キューブ1個につき+1VP"}, {"id": "p1g5r1", "name": "名誉", "info": "グローリーチット1枚につき+1VP"}, {"id": "p1g5r2", "name": "統一", "info": "評議員がいるイデオロギー1種類につき+1VP"}, {"id": "p1g5r3", "name": "権威", "info": "クレイムディスク1個につき+1VP"}, {"id": "p1g5r4", "name": "平等", "info": "コロニードーム1個につき+1VP"}, {"id": "p1g5r5", "name": "個性", "info": "ハザード付きランダーバーンのあるサイトの木製／プラスチック製トークン1個につき+1VP"}]}], [{"heading": "TW級スラスター・フューチャー（M1）", "items": [{"id": "p2g0r0", "name": "大型ビーム伝送施設", "en": "Mass Beam", "info": "達成時7VP"}, {"id": "p2g0r1", "name": "宇宙生活者", "en": "Spacefaring", "info": "達成時7VP"}, {"id": "p2g0r2", "name": "ミニブラックホール", "en": "Mini-Black Hole", "info": "達成時10VP"}, {"id": "p2g0r3", "name": "軽水素核融合", "en": "Protium Fusion", "info": "達成時10VP"}, {"id": "p2g0r4", "name": "エンズマン式恒星船", "en": "Enzmann Starship", "info": "達成時12VP"}, {"id": "p2g0r5", "name": "リチウム化アンモニア推進恒星船", "en": "Lithiated Ammonia Starship", "info": "達成時14VP"}, {"id": "p2g0r6", "name": "核融合のキャンドル", "en": "Fusion Candle", "info": "達成時14VP"}]}, {"heading": "フレイター・フューチャー（M1）", "items": [{"id": "p2g1r0", "name": "宇宙への架け橋", "en": "Beanstalk", "info": "終了時、宇宙エレベータに接続した工場ごとに3VP\n（ゲーム中最初の達成者のみ）"}, {"id": "p2g1r1", "name": "スターウィスプ", "en": "Star Wisp", "info": "終了時：中性子サンレンズ6VP／EMサンレンズ11VP"}, {"id": "p2g1r2", "name": "巣箱船", "en": "Beehive Ark", "info": "達成時7VP"}, {"id": "p2g1r3", "name": "テラフォーミング", "en": "Terraform", "info": "達成時8VP"}, {"id": "p2g1r4", "name": "反物質", "en": "Antimatter", "info": "達成時10VP"}, {"id": "p2g1r5", "name": "系外惑星探査", "en": "Exoplanet Hunt", "info": "終了時、セドナにクレイムがあれば12VP"}, {"id": "p2g1r6", "name": "太陽の黄金の林檎", "en": "Golden Apples", "info": "達成時14VP"}]}, {"heading": "コロニスト・フューチャー（M1／M2）", "items": [{"id": "p2g2r0", "name": "汎人類", "en": "Pan Sapiens", "info": "終了時、自分のグローリーチット1枚につき+2VP"}, {"id": "p2g2r1", "name": "地球外生命", "en": "ET Life", "info": "終了時、自分の宇宙生物学コロニー1つにつき+2VP"}, {"id": "p2g2r2", "name": "宇宙への架け橋（コロニスト）", "en": "Beanstalk", "info": "終了時、エレベータに接続した工場ごとに3VP\n（同じフューチャーの二重計上に注意）"}, {"id": "p2g2r3", "name": "海中都市", "en": "Submariner", "info": "ダートサイド水資源を2倍にする。他の関連修正は無効。加点分を入力"}, {"id": "p2g2r4", "name": "分離主義（新アッティカ分離主義者）", "en": "Secession, New Attica Secessionists", "info": "達成時7VP"}, {"id": "p2g2r5", "name": "カルト的指導者", "en": "Supreme Cult Leader", "info": "終了時、有効理念が「権威」なら10VP"}, {"id": "p2g2r6", "name": "分離主義（兵士カースト）", "en": "Secession, Soldier Caste", "info": "達成時7VP"}, {"id": "p2g2r7", "name": "人工意識", "en": "Artificial Consciousness", "info": "達成時10VP"}, {"id": "p2g2r8", "name": "ダイソン泡", "en": "Dyson Bubble", "info": "自分が所有する水星の工場1つにつき5VP"}, {"id": "p2g2r9", "name": "地球外生命探査（SETI）", "en": "SETI", "info": "達成時10VP"}, {"id": "p2g2r10", "name": "降伏の儀式", "en": "Footfall", "info": "達成時10VP"}, {"id": "p2g2r11", "name": "金星の新天地", "en": "New Venus", "info": "達成時12VP"}, {"id": "p2g2r12", "name": "知性化", "en": "Uplift", "info": "達成時12VP"}, {"id": "p2g2r13", "name": "TNO", "en": "TNO", "info": "達成時12VP"}, {"id": "p2g2r14", "name": "空中都市", "en": "Aerostat", "info": "達成時14VP"}]}]];
const STORE='hf4jp-score-v1';
const defaultState=()=>({count:4,names:Array.from({length:6},(_,i)=>'P'+(i+1)),values:{}});
let state=defaultState();try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&typeof x==='object')state={...defaultState(),...x}}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=(id,p)=>{const v=state.values[id]?.[p];return v==null||v===''?0:Number(v)||0};
const sum=(arr,p)=>arr.reduce((s,section)=>s+section.items.reduce((t,item)=>t+score(item.id,p),0),0);
const points=DATA.flatMap(p=>p.flatMap(s=>s.items));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('status').textContent='保存済み'}catch(e){document.getElementById('status').textContent='保存不可（ブラウザ設定をご確認ください）'}}
function cells(fn,cls=''){return Array.from({length:6},(_,p)=>`<td class="${cls} pcol p${p}" ${p>=state.count?'style="display:none"':''}>${fn(p)}</td>`).join('')}
function table(pageIndex){let rows='';for(const sect of DATA[pageIndex]){rows+=`<tr class="section"><td colspan="8">${esc(sect.heading)}</td></tr>`;for(const [itemIndex,item] of sect.items.entries()){const isFactory=pageIndex===0&&sect.heading==='工場資産価値';const nameHtml=esc(item.name)+(item.en?`<span class="english-name" lang="en">${esc(item.en)}</span>`:'');const infoHtml=(!isFactory||itemIndex===0)?`<td class="info${isFactory?' factory-shared':''}"${isFactory?' rowspan="6"':''}>${esc(item.info)}</td>`:'';rows+=`<tr><td class="name">${nameHtml}</td>${infoHtml}${cells(p=>`<input aria-label="${esc(item.name)} ${p+1}" class="score-input" type="number" step="1" min="0" inputmode="numeric" data-id="${item.id}" data-p="${p}" value="${state.values[item.id]?.[p]??''}" placeholder="" />`,'score')}</tr>`;}}
const totalName=pageIndex===0?'1ページ目 合計VP':'フューチャー 合計VP';
rows+=`<tr class="subtot"><td colspan="2">${totalName}</td>${cells(p=>`<span data-subtotal="${pageIndex}-${p}">${sum(DATA[pageIndex],p)}</span>`,'number')}</tr>`;
if(pageIndex===1){rows+=`<tr class="subtot"><td colspan="2">1ページ目 合計VP</td>${cells(p=>`<span data-subtotal="0-${p}">${sum(DATA[0],p)}</span>`,'number')}</tr>`;rows+=`<tr class="total"><td colspan="2">総合計VP</td>${cells(p=>`<span data-total="${p}">${sum(DATA[0],p)+sum(DATA[1],p)}</span>`,'number')}</tr>`}
return `<section class="page"><div class="heading"><h2>High Frontier 4 All ｜ ${pageIndex===0?'ゲーム終了時得点':'フューチャー得点'}</h2><p>${pageIndex+1} / 2</p></div><table class="score-table"><thead><tr><th class="col-name">項目</th><th class="col-info">VP・得点条件</th>${Array.from({length:6},(_,p)=>`<th class="player-col pcol p${p}" ${p>=state.count?'style="display:none"':''}><input class="player-name" data-player="${p}" aria-label="プレイヤー${p+1}の名前" maxlength="24" value="${esc(state.names[p]??'P'+(p+1))}" /></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table><div class="footer"><span>数値はVPを直接入力 ／ 未入力は0VPとして集計</span><span>High Frontier 4 All 日本語得点表</span></div></section>`}
function updateTotals(){document.querySelectorAll('[data-subtotal]').forEach(el=>{const [page,p]=el.dataset.subtotal.split('-').map(Number);el.textContent=sum(DATA[page],p)});document.querySelectorAll('[data-total]').forEach(el=>{const p=Number(el.dataset.total);el.textContent=sum(DATA[0],p)+sum(DATA[1],p)})}
function render(){document.getElementById('count').value=state.count;document.getElementById('pages').innerHTML=table(0)+table(1);document.querySelectorAll('tr.section').forEach(tr=>tr.querySelector('td').colSpan=2+state.count)}
document.getElementById('pages').addEventListener('input',e=>{const t=e.target;if(t.matches('.score-input')){const p=Number(t.dataset.p),id=t.dataset.id;if(!state.values[id])state.values[id]=Array(6).fill('');state.values[id][p]=t.value===''?'':Math.max(0,Number(t.value)||0);updateTotals();persist()}else if(t.matches('.player-name')){state.names[Number(t.dataset.player)]=t.value;persist()}});
document.getElementById('count').addEventListener('change',e=>{state.count=Number(e.target.value);render();persist()});
document.getElementById('print').addEventListener('click',()=>window.print());
document.getElementById('reset').addEventListener('click',()=>{if(confirm('すべての入力済み得点とプレイヤー名を初期化しますか？')){state=defaultState();render();persist()}});
render();
</script></body></html>
